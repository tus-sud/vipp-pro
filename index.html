<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000208" />
  <title>Trái Tim 5D 💙</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Sân khấu 5D nền đen sâu y hệt video mẫu -->
  <canvas id="scene5d" aria-label="Hiệu ứng trái tim 5D ánh sáng xanh và hình ảnh xoay rơi"></canvas>

  <!-- Nút tối giản góc trên phải -->
  <div class="hud-bar">
    <button
      id="burstTrigger"
      class="hud-icon-btn"
      type="button"
      title="Kích hoạt làn sóng lửa xanh & pháo hoa"
      aria-label="Kích hoạt hiệu ứng ánh sáng xanh"
    >
      ✨
    </button>

    <button
      id="musicToggle"
      class="hud-pill"
      type="button"
      aria-pressed="false"
      aria-label="Bật hoặc tắt nhạc nền"
    >
      <span class="hud-disc" aria-hidden="true">♪</span>
      <span id="musicLabel" class="hud-label">Bật nhạc</span>
      <span class="hud-eq" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>
  </div>

  <!-- Gợi ý nhỏ tự mờ đi -->
  <div id="gestureHint" class="gesture-hint" aria-hidden="true">
    Kéo xoay 360° • Chạm bắn hạt sáng • Bấm ảnh phóng to ✨
  </div>

  <!-- Khung phóng to khi chạm vào tấm ảnh -->
  <div id="photoModal" class="photo-modal" hidden role="dialog" aria-modal="true" aria-label="Xem phóng to ảnh">
    <div class="photo-modal-card">
      <img id="photoModalImg" src="" alt="Hình ảnh phóng to" />
    </div>
  </div>

  <audio id="customAudio" loop preload="metadata"></audio>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
